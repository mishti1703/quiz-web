<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quiz website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script src="script.js" defer></script>
    <main>
      <div class="welcome_screen">
        <h1>QUIZ MASTER</h1>

        <button id="start_btn">Start Test</button>
      </div>
      <div class="test_screen">
       <div class="question_box">
          <div class="back">
          <button id="backbtn">←</button>
        </div>
        <h2>the question will appear here </h2>
        <div class="options">
          <button>1 </button>
          <button>2 </button>
          <button>3 </button>
          <button>4</button>
        </div>
        <button class="nextbtn">NEXT</button>
        <!-- <div class="timer">00</div> -->
       
       </div>
      </div>
      <div class="result">
        <h1>result</h1>
      </div>
    </main>
  </body>
</html>
